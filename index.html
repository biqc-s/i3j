<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saeed Ahmad Jahash | Transformational Leader</title>
    <meta name="description" content="Portfolio of Saeed Ahmad Jahash – CEO, PMP®, ISO 9001 Lead Auditor and transformational leader in media, quality and technology. Download the ATS-friendly CV in English or Arabic.">
    <meta name="author" content="Saeed Ahmad Jahash">
    <meta name="theme-color" content="#05050c">
    <link rel="canonical" href="https://i3j.io/">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">

    <!-- Link previews (WhatsApp, X/Twitter, LinkedIn, Telegram, iMessage).
         Crawlers do not run JavaScript, so these static values are what they show. -->
    <meta property="og:type" content="profile">
    <meta property="og:site_name" content="i3j.io">
    <meta property="og:url" content="https://i3j.io/">
    <meta property="og:title" content="Saeed Ahmad Jahash | سعيد أحمد جهاش">
    <meta property="og:description" content="CEO • PMP® • ISO 9001 Lead Auditor • Digital Transformation — Portfolio &amp; ATS CV | الموقع الشخصي والسيرة الذاتية">
    <meta property="og:locale" content="en_US">
    <meta property="og:locale:alternate" content="ar_SA">
    <meta property="og:image" content="https://i3j.io/og-image.jpg">
    <meta property="og:image:secure_url" content="https://i3j.io/og-image.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Saeed Ahmad Jahash — سعيد أحمد جهاش">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Saeed Ahmad Jahash | سعيد أحمد جهاش">
    <meta name="twitter:description" content="CEO • PMP® • ISO 9001 Lead Auditor • Digital Transformation">
    <meta name="twitter:image" content="https://i3j.io/og-image.jpg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cv.css">
</head>
<body class="has-cv-print">

    <a class="skip-link" href="#main" data-i18n="labels.skip">Skip to content</a>
    <div class="scroll-progress" id="scrollProgress" aria-hidden="true"></div>

    <!-- Custom Cursor -->
    <div class="cursor-dot" aria-hidden="true"></div>
    <div class="cursor-outline" aria-hidden="true"></div>

    <!-- Ambient Background -->
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="bg-orb bg-orb-1" aria-hidden="true"></div>
    <div class="bg-orb bg-orb-2" aria-hidden="true"></div>
    <div class="bg-orb bg-orb-3" aria-hidden="true"></div>

    <!-- ═══════════════ HEADER ═══════════════ -->
    <header id="header">
        <nav class="nav-container" aria-label="Primary">
            <a class="logo" href="#hero" aria-label="Home">
                <span class="logo-s">S</span><span class="logo-dot">.</span>
            </a>
            <ul class="nav-links" id="navLinks"></ul>
            <div class="nav-actions">
                <div class="cv-dropdown" data-cv-menu data-compact></div>
                <button type="button" class="lang-toggle" id="langToggle" data-i18n-aria="labels.toggleLang">
                    <i class="fas fa-globe" aria-hidden="true"></i>
                    <span class="lang-next" lang="ar">العربية</span>
                </button>
                <button type="button" class="hamburger" id="hamburger" aria-controls="navLinks" aria-expanded="false" data-i18n-aria="labels.menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </nav>
    </header>

    <main id="main">

        <!-- ═══════════════ HERO ═══════════════ -->
        <section id="hero">
            <div class="hero-content">
                <div class="hero-availability-tag" id="heroAvailable">
                    <span class="pulse-dot"></span>
                    <span data-i18n="hero.available">Open to Collaboration</span>
                </div>
                <p class="hero-greeting" data-i18n="hero.greeting">Hello, I am</p>
                <h1 class="hero-name" id="heroName">
                    <span class="name-line-1">Saeed</span>
                    <span class="name-line-2">Ahmad <em class="name-accent">Jahash</em></span>
                </h1>
                <div class="hero-typewriter-wrap">
                    <span id="typewriterText" class="typewriter-text"></span><span class="typewriter-cursor" aria-hidden="true">|</span>
                </div>
                <div class="hero-actions">
                    <a href="#about" class="btn-hero">
                        <span data-i18n="hero.cta">Discover My Journey</span>
                        <span class="btn-hero-arrow"><i class="fas fa-arrow-right"></i></span>
                    </a>
                    <div class="cv-dropdown cv-dropdown-hero" data-cv-menu></div>
                </div>
                <div class="hero-stats-row" id="heroStats"></div>
            </div>

            <div class="hero-visual" aria-hidden="true">
                <div class="ring ring-1"></div>
                <div class="ring ring-2"></div>
                <div class="ring ring-3"></div>
                <div class="avatar-core" id="avatarCore">
                    <span class="avatar-initials">SJ</span>
                    <div class="avatar-glow"></div>
                </div>
                <div id="heroBadges"></div>
            </div>

            <div class="scroll-cue" aria-hidden="true">
                <div class="scroll-wheel-wrap">
                    <div class="scroll-wheel-inner"></div>
                </div>
            </div>
        </section>

        <!-- Sections below are rendered from data/content/*.json by js/site.js
             (edit the content from the Pages CMS dashboard — see README) -->
        <section id="about"        data-section="about"></section>
        <section id="experience"   data-section="experience"></section>
        <section id="projects"     data-section="projects"></section>
        <section id="achievements" data-section="achievements" hidden></section>
        <section id="skills"     data-section="skills"></section>
        <section id="education"  data-section="education"></section>
        <section id="testimonials" data-section="testimonials" hidden></section>

        <noscript>
            <p class="noscript">This site needs JavaScript to display its content. <a href="cv.html">Open the CV</a>.</p>
        </noscript>
    </main>

    <!-- ═══════════════ FOOTER / CONTACT ═══════════════ -->
    <footer id="contact">
        <div class="container">
            <div class="footer-inner">
                <div class="footer-headline">
                    <h2 id="contactTitle"></h2>
                    <p data-i18n="contact.subtitle">Ready to transform your vision into reality?</p>
                </div>
                <div class="footer-contacts" id="footerContacts"></div>
                <div class="cv-dropdown cv-dropdown-footer" data-cv-menu data-up></div>
                <p class="copyright">&copy; <span id="year"></span> <span id="copyName">Saeed Ahmad Jahash</span> &mdash; <span data-i18n="labels.rights">All Rights Reserved</span></p>
            </div>
        </div>
    </footer>

    <button type="button" class="back-to-top" id="backToTop" data-i18n-aria="labels.backToTop">
        <i class="fas fa-arrow-up" aria-hidden="true"></i>
    </button>

    <!-- Image viewer for project / achievement photos -->
    <dialog class="lightbox" id="lightbox">
        <button type="button" class="lightbox-close" data-i18n-aria="labels.close"><i class="fas fa-xmark" aria-hidden="true"></i></button>
        <img id="lightboxImg" src="data:," alt="">
        <p id="lightboxCaption"></p>
    </dialog>

    <script src="data/ui.js"></script>
    <script src="js/core.js"></script>
    <script src="js/cv.js"></script>
    <script src="js/site.js"></script>
</body>
</html>
